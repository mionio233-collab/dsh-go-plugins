name: Validate plugin packages
on: [pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/publish-go-plugins.py --source plugins --base-url https://example.com/validation/plugins --output /tmp/dsh-go-catalog.json
